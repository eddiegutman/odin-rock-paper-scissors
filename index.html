<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="main">
    <h1>Rock Paper Scissors</h1>
    <div id="container-moves">
      <button id="move-rock" class="btn-move">🪨</button>
      <button id="move-paper" class="btn-move">🧻</button>
      <button id="move-scissors" class="btn-move">✂️</button>
    </div>
    <div id="result"></div>
    <div class="scores">
      <div class="score-container">
        <span id="score-human">0</span>
        <span>Human</span>
      </div>
      <div class="score-container">
        <span id="score-computer">0</span>
        <span>Computer</span>
      </div>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <p id="modal-message"></p>
      <button id="restart-game">Restart</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.1/dist/confetti.browser.min.js"></script>
  <script src="./script.js"></script>
</body>

</html>
